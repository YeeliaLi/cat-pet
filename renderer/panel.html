<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>猫咪日程</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header id="titlebar">
    <div class="title">🐱 本周日程</div>
    <div class="week-nav">
      <button id="prev" title="上一周">‹</button>
      <button id="today">今天</button>
      <button id="next" title="下一周">›</button>
      <span id="range"></span>
    </div>
    <button id="close" class="icon" title="收起">✕</button>
  </header>

  <main>
    <aside id="side">
      <section class="card pomo">
        <div id="pomoMode" class="idle">空闲</div>
        <div id="pomoTime">25:00</div>
        <div class="pomo-btns">
          <button id="startFocus" class="primary">开始专注</button>
          <button id="startBreak">开始休息</button>
          <button id="stop">停止</button>
        </div>
        <div class="pomo-settings">
          专注 <input id="focusMin" type="number" min="1" max="180" /> 分
          休息 <input id="breakMin" type="number" min="1" max="180" /> 分
        </div>
        <div id="todayCount">今天已完成 0 个番茄 🍅</div>
      </section>

      <section class="card">
        <h3>今天</h3>
        <ul id="todayList"></ul>
      </section>
    </aside>

    <section id="calendar">
      <div id="scroll">
        <div id="dayHeads"></div>
        <div id="grid"></div>
      </div>
    </section>
  </main>

  <dialog id="dlg">
    <form id="evForm">
      <h3 id="dlgTitle">新建日程</h3>
      <label>标题<input id="fTitle" type="text" maxlength="60" autocomplete="off" /></label>
      <label>日期<input id="fDate" type="date" /></label>
      <div class="row">
        <label>开始<input id="fStart" type="time" /></label>
        <label>结束<input id="fEnd" type="time" /></label>
      </div>
      <label class="check"><input id="fDone" type="checkbox" /> 已完成</label>
      <div id="dlgError"></div>
      <div class="dlg-btns">
        <button type="button" id="btnDelete" class="danger">删除</button>
        <span class="spacer"></span>
        <button type="button" id="btnCancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
  </dialog>

  <script src="panel.js"></script>
</body>
</html>
